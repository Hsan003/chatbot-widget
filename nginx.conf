# Serves the widget bundle to merchant sites (any origin may load it)
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        # Short cache: the file name doesn't change between versions
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types application/javascript image/svg+xml;
}
